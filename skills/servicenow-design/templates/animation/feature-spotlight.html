<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ServiceNow feature spotlight</title>
<link rel="stylesheet" href="../../tokens/fonts.css">
<link rel="stylesheet" href="../../tokens/colors.css">
<link rel="stylesheet" href="../../tokens/gradients.css">
<style>
  html,body{margin:0;height:100%;background:#021c29;overflow:hidden}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
    font-family:"ServiceNow Sans",sans-serif;color:#fff;background:var(--grad-dark-green)}
  #world{position:absolute;left:0;top:0;transform-origin:0 0}
  #shot{display:block;border-radius:12px}
  #spot{position:absolute;border-style:solid;border-color:#63DF4E;box-shadow:0 0 0 99999px rgba(3,45,66,.62)}
  #intro,#outro{position:absolute;left:86px;right:86px}
  .mono{font-family:"ServiceNow Mono",monospace;font-size:24px;letter-spacing:.18em;text-transform:uppercase;color:#63DF4E}
  .h1{font-weight:700;font-size:96px;line-height:1.02;letter-spacing:-.01em}
  .h1 em{font-style:normal;color:#63DF4E}
  #callout{position:absolute;left:86px;bottom:120px;max-width:820px;padding:36px 44px;border-radius:23px;
    background:rgba(3,45,66,.9);border:1px solid rgba(255,255,255,.35)}
  #callout .t{font-weight:700;font-size:56px;line-height:1.05;margin-top:18px}
  #callout .b{font-weight:300;font-size:32px;line-height:1.15;margin-top:18px}
  .logo{position:absolute;left:75px;top:1001px;width:154px}
  .dbg{position:absolute;border:2px dashed #FFBC39;color:#FFBC39;font:20px monospace}
  #hud{position:fixed;left:12px;bottom:10px;font:12px/1 monospace;color:#9ab}
</style>
</head>
<body>
<div id="stage">
  <div id="world"><img id="shot" alt=""><div id="spot"></div></div>
  <div id="intro" style="top:120px"><div class="mono" id="introEyebrow"></div><div class="h1" id="introTitle" style="margin-top:28px"></div></div>
  <div id="callout"><div class="mono" id="cLabel"></div><div class="t" id="cTitle"></div><div class="b" id="cBody"></div></div>
  <div id="outro" style="top:340px"><div class="h1" id="outroTitle" style="font-size:120px"></div>
    <img src="../../assets/logos/ServiceNow_logo_RGB_White_WasabiGreen.png" style="width:360px;margin-top:90px;display:block" alt="servicenow"></div>
  <img class="logo" id="footer" src="../../assets/logos/servicenow-wordmark-white-footer.svg" alt="servicenow">
</div>
<div id="hud"></div>
<script>
/* ── EDIT THIS ──────────────────────────────────────────────────────────────
   image: path to the screenshot (relative to this file); width/height: its pixel size.
   shots: regions to spotlight, in SCREENSHOT PIXELS (x, y, w, h from top-left).
   Open with ?debug=1 to overlay every region box and check the coordinates.     */
const CONFIG = {
  image: 'examples/ai-performance-dashboard.png', width: 1907, height: 938,
  eyebrow: 'SAM Operations AI Specialist',
  title: '<em>Entitlements,</em> created by AI.',
  outro: '<em>You start it.</em><br>AI finishes it.',
  intro: 3, move: 1.2, hold: 3.4, outroHold: 3,
  shots: [
    { x: 1290, y: 342, w: 588, h: 376, label: 'Completion rate', title: '63% created autonomously', body: 'Most entitlements now finish without a human touch.' },
    { x: 683,  y: 342, w: 588, h: 376, label: 'Entitlements processed', title: '24% processed by the AI Specialist', body: 'Volume shifts to the agent as confidence grows.' },
    { x: 76,   y: 736, w: 892, h: 202, label: 'Autonomous vs AI assisted', title: 'Autonomous leads', body: 'Autonomous runs outpace AI-assisted work.' },
  ],
};
/* ─────────────────────────────────────────────────────────────────────────── */

const $ = id => document.getElementById(id);
const ease = t => { t = Math.min(1, Math.max(0, t)); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const out = t => { t = Math.min(1, Math.max(0, t)); return 1 - Math.pow(1 - t, 3); };
const lerp = (a, b, p) => a + (b - a) * p;
const SW = 1920, SH = 1080;

$('shot').src = CONFIG.image; $('shot').style.width = CONFIG.width + 'px';
$('introEyebrow').textContent = CONFIG.eyebrow; $('introTitle').innerHTML = CONFIG.title; $('outroTitle').innerHTML = CONFIG.outro;

// camera states: full view, then one per shot, then full view again
const fullCam = () => { const s = Math.min(1748 / CONFIG.width, 700 / CONFIG.height); return { s, cx: CONFIG.width / 2, cy: CONFIG.height / 2, ty: 670 }; };
const shotCam = r => { const s = Math.min(2.4, 1200 / r.w, 560 / r.h); return { s, cx: r.x + r.w / 2, cy: r.y + r.h / 2, ty: 400 }; };

// timeline
const segs = []; let t = CONFIG.intro;
CONFIG.shots.forEach((r, i) => { segs.push({ i, start: t, settle: t + CONFIG.move, end: t + CONFIG.move + CONFIG.hold }); t += CONFIG.move + CONFIG.hold; });
const OUTRO = t, DURATION = t + CONFIG.move + CONFIG.outroHold;

function camAt(T) {
  const full = fullCam();
  let from = full, to = full, p = 0;
  if (T >= CONFIG.intro) {
    const k = segs.findIndex(s => T < s.end);
    if (k === -1) { from = shotCam(CONFIG.shots[CONFIG.shots.length - 1]); to = { ...full, s: full.s * 0.9 }; p = ease((T - OUTRO) / CONFIG.move); }
    else { const s = segs[k]; from = k ? shotCam(CONFIG.shots[k - 1]) : full; to = shotCam(CONFIG.shots[k]); p = ease((T - s.start) / CONFIG.move); }
  }
  // slow push-in while holding so the frame never sits still
  const drift = 1 + 0.03 * Math.sin(T * 0.6);
  return { s: lerp(from.s, to.s, p) * drift, cx: lerp(from.cx, to.cx, p), cy: lerp(from.cy, to.cy, p), ty: lerp(from.ty, to.ty, p) };
}

function render(T) {
  const c = camAt(T);
  // keep the screenshot covering the stage whenever it is larger than the stage (no exposed edges mid-zoom)
  let tx = SW / 2 - c.cx * c.s, ty = c.ty - c.cy * c.s;
  const iw = CONFIG.width * c.s, ih = CONFIG.height * c.s;
  if (iw > SW) tx = Math.min(0, Math.max(SW - iw, tx));
  if (ih > SH) ty = Math.min(0, Math.max(SH - ih, ty));
  $('world').style.transform = `translate(${tx}px,${ty}px) scale(${c.s})`;

  const k = segs.findIndex(s => T >= s.start && T < s.end);
  const seg = segs[k];
  const r = seg ? CONFIG.shots[k] : null;
  const spotIn = seg ? out((T - seg.settle + 0.2) / 0.5) * (1 - out((T - seg.end + 0.35) / 0.35)) : 0;
  const sp = $('spot');
  if (r) Object.assign(sp.style, { left: r.x - 8 + 'px', top: r.y - 8 + 'px', width: r.w + 16 + 'px', height: r.h + 16 + 'px',
    borderWidth: 4 / c.s + 'px', borderRadius: 14 / c.s + 'px' });
  sp.style.opacity = spotIn;

  const co = $('callout');
  if (r) { $('cLabel').textContent = r.label; $('cTitle').textContent = r.title; $('cBody').textContent = r.body || ''; }
  co.style.opacity = spotIn; co.style.transform = `translateY(${(1 - spotIn) * 30}px)`;

  const ip = out(T / 0.7) * (1 - out((T - CONFIG.intro + 0.4) / 0.4));
  $('intro').style.opacity = ip; $('intro').style.transform = `translateY(${(1 - out(T / 0.7)) * 30}px)`;
  const op = out((T - OUTRO - CONFIG.move * 0.6) / 0.7);
  $('outro').style.opacity = op; $('outro').style.transform = `translateY(${(1 - op) * 30}px)`;
  $('world').style.opacity = 1 - op;
  $('footer').style.opacity = 1 - op;
  hud.textContent = render.hud ? `${T.toFixed(2)}s / ${DURATION.toFixed(1)}s · space play/pause · ←/→ scrub` : '';
}

// deterministic hooks for scripts/render_video.mjs
window.__duration = DURATION;
window.__seek = T => { window.__T = T; window.__paused = true; render(T); };

const params = new URLSearchParams(location.search), rendering = params.has('render');
if (params.has('debug')) CONFIG.shots.forEach((r, i) => {
  const d = document.createElement('div'); d.className = 'dbg'; d.textContent = i + 1;
  Object.assign(d.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' }); $('world').appendChild(d);
});
const stage = $('stage');
function fit() {
  if (!rendering && (!innerWidth || !innerHeight)) return requestAnimationFrame(fit);
  const s = rendering ? 1 : Math.min(innerWidth / SW, innerHeight / SH);
  stage.style.transform = `translate(${(innerWidth - SW * s) / 2}px,${(innerHeight - SH * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit); new ResizeObserver(fit).observe(document.documentElement); fit();

if (!rendering) {
  render.hud = true;
  window.__T = +localStorage.getItem('sn-spot-t') || 0; let last = performance.now();
  const loop = now => {
    if (!window.__paused) window.__T = (window.__T + (now - last) / 1000) % DURATION;
    last = now; render(window.__T); localStorage.setItem('sn-spot-t', window.__T); requestAnimationFrame(loop);
  };
  addEventListener('keydown', e => {
    if (e.code === 'Space') window.__paused = !window.__paused;
    if (e.code === 'ArrowRight') window.__T = Math.min(DURATION, window.__T + 0.5);
    if (e.code === 'ArrowLeft') window.__T = Math.max(0, window.__T - 0.5);
  });
  requestAnimationFrame(loop);
} else { $('hud').remove(); render(0); }
</script>
</body>
</html>
